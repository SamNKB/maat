[project]
name = "maat"
version = "0.1.0"
description = "Análise descritiva de dados sobre pandas e PySpark, guiada pela taxonomia de variáveis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sam Nobukuni", email = "samnobukuni@gmail.com" }]
keywords = ["eda", "data-profiling", "pandas", "pyspark", "análise descritiva"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Natural Language :: Portuguese (Brazilian)",
]
# O núcleo não tem dependências: a taxonomia, a inferência e os
# renderizadores são código puro. Cada backend traz a sua.
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
spark = ["pyspark>=3.4"]
yaml = ["pyyaml>=6.0"]
dev = ["pytest>=8.0", "ruff>=0.4", "pandas>=2.0", "pyyaml>=6.0"]
# ydata-profiling exige numpy<=2.3 e pandas<3 — instale em ambiente isolado
# para rodar o baseline competitivo (ver docs/comparacao-ydata.md).
baseline = ["ydata-profiling>=4.0"]

[project.urls]
Homepage = "https://github.com/SamNKB/maat"
Documentation = "https://samnkb.github.io/maat/fluxo-interativo.html"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
    "benchmark: roda sobre os 40 datasets completos; pulado se ausentes",
    "spark: exige PySpark e Java instalados",
]

[tool.ruff]
line-length = 90
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
