[project]
name = "maat"
version = "0.1.0"
description = "Análise descritiva de dados sobre pandas e PySpark, guiada pela taxonomia de variáveis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sam Nobukuni", email = "samnobukuni@gmail.com" }]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
spark = ["pyspark>=3.4"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
